<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Meta etiqueta para indicar a google la descripción-->
    <meta name="description" content="Primera página web del curso de programación completo">

    <title>Primer Documento HTML</title>
</head>

<body>

    <!--Etiqueta para visualizar el encabezado-->
    <header>
        <!--Etiquetas de Títulos-->
        <h1>Soy un h1</h1>
        <h2>Soy un h2</h2>
        <h3>Soy un h3</h3>
        <h4>soy un h4</h4>
        <h5>soy un h5</h5>
        <h6>soy un h6</h6>

        <!--Etiqueta para ver la barra de navegación-->
        <nav>
            <!--Etiqueta para poder crear enlaces en entre páginas-->
            <a href="index.html">Soy un enlace a esta página</a>
            <!--Etiqueta para mandar la siguiente etiqueta abajo-->
            <br>

            <a href="https://www.google.com/">Soy un enlace a otra página</a>
        </nav>
    </header>
    <!--Etiqueta para mostrar el contenido principal-->
    <main>

        <!--Etiqueta para generar contenedores en la página-->
        <div>
            <!--Existen algunos tipos de contenedores-->
            <!--Este servirá para poder tener un contenedor para específicar una información alejada de lo demás -->
            <article></article>

            <!--Este servirá para separar el contenido en secciones, como inicio, tratamientos, productos, etc-->
            <section></section>

            <!--Etiqueta para poder poner imágenes-->
            <!--El src es el archivo de imagen 
            el alt es en caso que no se vea la imagen, al pasar el cursor se mostrará el texto de referencia que le pones a la img
            width es para el ancho
            height es para el alto-->
            <img src="añaño.png" alt="imagen goti de ichigo y orihime" width="540px" height="540px">
        </div>


        <!--Etiqueta para formulario-->
        <form role="search">

            <!-- Es para que se cree una cajita para poder escribir-->
            <input type="text" placeholder="Escribe algo acá">

            <!-- Es cuando encesitamos poner un correo, si no se cumple un formato, saldrá un error-->
            <input type="email" placeholder="Escribe tu email">

            <!-- Es para escribir algo privado como la contraseña, saldrá no visible para el usuario-->
            <input type="password" placeholder="Escribe tu contraseña">

            <!--   -->

            <!--   -->

            <!--   -->

            <!--   -->

            <!--   -->

        </form>


    </main>

    <!--Etiqueta para ver el pie de página-->
    <footer>

    </footer>










</body>

</html>
